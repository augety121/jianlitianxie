<!doctype html><meta charset="utf-8"><title>简道云扫描填写回归</title><button id="run">运行回归</button><pre id="report"></pre>
<div class="fx-field"><div class="field-name">姓名</div><input id="name"></div>
<div class="fx-field"><div class="field-name">性别</div><div id="gender" class="x-combo" tabindex="0"><span class="value-content"><span class="dropdown-label-placeholder">请选择</span></span></div></div>
<div class="x-popup x-combo-dropdown" id="menu" hidden><div class="x-combo-dropdown-item">男</div><div class="x-combo-dropdown-item">女</div></div>
<div class="fx-field"><div class="field-name">是否有实习经历</div><div class="x-radio-group" id="radio"><div class="x-radio"><div class="x-radio-wrapper"><span class="radio-text">是</span></div></div><div class="x-radio"><div class="x-radio-wrapper"><span class="radio-text">否</span></div></div></div></div>
<div class="fx-field"><div class="field-name">出生年月</div><div class="fx-form-datetime"><input id="birth"></div></div>
<div class="fx-field"><div class="field-name">实习经历</div><div class="subform-head"><div class="subform-row"><div class="subform-cell"><span class="required">*</span><span class="subform-title" title="公司">公司</span></div><div class="subform-cell"><span class="subform-title" title="职位">职位</span></div></div></div><div class="fx-subform-row"><div class="subform-cell"><div class="fx-sub-field"><input id="company" value="示例公司"></div></div><div class="subform-cell"><div class="fx-sub-field"><input id="role"></div></div></div></div>
<div class="fx-field"><div class="field-name">简历附件</div><div class="fx-form-file"><input type="file" hidden><div contenteditable="true" style="position:absolute;left:-9000px"></div></div></div>
<div class="fx-field ui-invisible"><div class="field-name">不应扫描</div><input></div>
<div class="fx-field" id="awards"><div class="field-name">获奖经历</div><div class="subform-head"><div class="subform-row"><div class="subform-cell"><span class="subform-title" title="奖项名称">奖项名称</span></div></div></div><div class="fx-subform-row"><div class="subform-cell"><div class="fx-sub-field"><input></div></div></div><button type="button" id="add-award">添加</button></div><div class="fx-field"><div class="field-name">意向岗位</div><select multiple id="roles"><option value="a">后端</option><option value="b">AI</option></select></div><div class="fx-field"><div class="field-name">意向团队</div><div class="x-combocheck" id="teams"><div class="value-content"></div></div></div><div class="x-popup x-combo-dropdown" id="team-menu" hidden><div class="x-combo-dropdown-item">团队甲</div><div class="x-combo-dropdown-item">团队乙</div></div><script src="../extension/engine.js"></script><script type="module" src="jiandaoyun-fixture.mjs"></script>
