<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>隔离测试 · 简历填写</title><style>body{font:16px sans-serif;margin:30px}label{display:block;margin:8px}pre{white-space:pre-wrap}input,select{padding:6px}</style><h1>隔离表单测试</h1><p>仅虚构测试资料，不连接招聘网站。</p><form id="form"><label>姓名<input id="name"></label><label>邮箱<input id="mail" value="keep@example.test"></label><label>学历<select id="degree"><option value="">请选择</option><option value="master">硕士研究生</option></select></label><label>自我评价<textarea id="intro"></textarea></label><label>出生日期<input type="date" id="birth"></label><label>验证码<input id="captcha"></label><label>同意声明<input type="checkbox" id="consent"></label><fieldset><legend>性别</legend><label>男<input type="radio" name="gender" value="m"></label><label>女<input type="radio" name="gender" value="f"></label></fieldset><label>入学月份<input id="month" type="month"></label><label>证件照<input id="photo" type="file" accept="image/png" style="display:none"></label><button type="submit">最终提交（测试计数）</button></form><button id="run">运行隔离验证</button><pre id="report">尚未运行</pre><script src="../extension/engine.js"></script><script type="module" src="fixture.mjs"></script></html>
