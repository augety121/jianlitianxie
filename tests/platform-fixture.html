<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>跨平台控件回归</title><style>body{font:15px sans-serif;margin:25px}section{border:1px solid #aaa;padding:12px;margin:10px}input,select,textarea{padding:5px}label{display:inline-block;margin:6px}pre{white-space:pre-wrap}[hidden]{display:none!important}</style><h1>跨平台控件回归（虚构数据）</h1><button id="run">运行跨平台验证</button><pre id="report">尚未运行</pre>
<section data-section="个人信息"><h2>Phoenix / Element</h2><div class="form-item"><label>电子邮箱</label><div class="form-item__control"><input id="email" placeholder="请输入"></div></div><div class="el-form-item is-required"><div class="el-form-item__label">体重(kg)</div><input id="weight" type="number"></div><div class="ant-form-item"><label>政治面貌</label><div class="ant-select"><input id="party" role="combobox" aria-controls="party-options" readonly><span class="ant-select-selection-item"></span></div></div><div id="party-options" role="listbox" hidden><div role="option">群众</div><div role="option">中共党员</div></div><div role="listbox"><div role="option">中共党员</div></div></section>
<section data-section="教育经历" data-entity="乙大学"><h2>教育经历乙</h2><label>学校名称<input value="乙大学"></label><div class="form-item"><label>所学专业</label><input id="major-b" placeholder="请输入"></div><div class="ant-form-item"><label>开始时间</label><div class="ant-picker"><input id="start-b" placeholder="YYYY-MM"></div></div></section>
<section data-section="教育经历" data-entity="甲大学"><h2>教育经历甲</h2><label>学校名称<input value="甲大学"></label><label>所学专业<input id="major-a"></label></section>
<table><caption>国家能源式表格 / 个人信息</caption><tr><td>身 高</td><td><input id="height" type="number"></td><td>出生日期</td><td><input id="birth" type="date"></td></tr></table>
<table><caption>教育经历</caption><thead><tr><th>学校名称</th><th>专业</th></tr></thead><tbody><tr><td><input value="乙大学"></td><td><input id="table-major-b"></td></tr><tr><td><input value="甲大学"></td><td><input id="table-major-a"></td></tr></tbody></table><section data-section="紧急联系人"><h2>紧急联系人</h2><label>姓名<input id="contact"></label><label>联系电话<input id="contact-phone"></label></section>
<section><h2>特殊控件</h2><label>意向城市<select multiple id="cities"><option value="a">甲市</option><option value="b">乙市</option></select></label><label>成绩单<input type="file" accept=".pdf" hidden></label><details><summary>折叠经历</summary><label>学校<input></label></details><label id="changing">原始字段<input id="rename"></label></section>
<script src="../extension/engine.js"></script><script type="module" src="platform-fixture.mjs"></script></html>
