name: Quality gates
on:
  workflow_dispatch:
    inputs:
      run_performance:
        description: 'Explicitly run historical matched benchmarks (includes source digest recording)'
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node test dependencies
        run: npm ci --ignore-scripts
      - name: Unit and release checks
        run: npm test && npm run check

  browser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: DOM and target-guard fixtures (not installed MV3 acceptance)
        run: npm run test:dom && npm run test:guards && npm run test:ui && npm run test:workspace && python tests/entity-binding-browser.py && npm run test:compatibility && npm run test:local && npm run test:jev && npm run test:oneclick && npm run test:recognition && npm run test:learn && python tests/recovery-browser.py && npm run test:empty-records && npm run test:readiness && npm run test:components
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-fixture-verification
          path: |
            test-results/**/*.json
            test-results/**/*.png
            !test-results/**/synthetic-encrypted-backup.json
          retention-days: 7

  matched-performance:
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Matched local-DOM comparison; never silently discard failures
        run: |
          npm run bench -- --pairs 3
          npm run bench:transport -- test-results/transport-benchmark.json 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-performance-raw
          path: |
            test-results/performance-matched.json
            test-results/transport-benchmark.json
          if-no-files-found: error
          retention-days: 14

  installed-mv3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install full test Chromium
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Installed extension and local-only MCP fixture
        run: npm run test:mv3 && npm run test:local-mv3 && npm run test:page-mv3 && npm run test:recognition-mv3 && npm run test:recovery-mv3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-mv3-verification
          path: |
            test-results/recovery-mv3.json
            test-results/recovery-installed.png
            test-results/recovery-preview-installed.png
            test-results/workspace-mv3.json
            test-results/recognition-repair-mv3.json
            test-results/recognition-repair-installed.png
            test-results/local-first-mv3.json
            test-results/local-first-installed.png
            test-results/page-entry-mv3.json
            test-results/page-entry-installed.png
            test-results/single-field-picker-installed.png
            test-results/learn-review-installed.png
            test-results/learn-reused-installed.png
          if-no-files-found: error
          retention-days: 14

  jev-local-matched:
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 8cdb273fc725ec6f771727456dfda02da5b05e58
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser
        working-directory: candidate
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Alternating comparison with independent value and scan-contract verification
        working-directory: candidate
        run: npm run bench:jev -- --baseline-root ../baseline --pairs 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-local-matched-raw
          path: candidate/test-results/jev-local-matched.json
          if-no-files-found: error
          retention-days: 14

  sandboxed-empty-records:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test browser
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install chromium
      - name: Sandbox-enabled installed zero-card workflow
        run: python tests/empty-record-mv3.py
      - name: Reviewed legacy profile recovery with real installed extension
        run: python tests/readiness-mv3.py
      - name: Component strategy browser regressions
        run: python tests/component-adapters-browser.py
      - name: Sandbox-enabled Moka DOM and installed extension workflows
        run: |
          python tests/moka-browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/moka-mv3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empty-record-windows-verification
          path: |
            test-results/moka-browser.json
            test-results/moka-synthetic.png
            test-results/moka-mv3.json
            test-results/moka-installed.png
            test-results/readiness-mv3.json
            test-results/readiness-repair-entry.png
            test-results/readiness-review.png
            test-results/readiness-completed.png
            test-results/component-adapters-browser.json
            test-results/component-phoenix.png
            test-results/empty-record-mv3.json
            test-results/empty-record-consent-installed.png
            test-results/empty-record-filled-installed.png
          if-no-files-found: error
          retention-days: 14
