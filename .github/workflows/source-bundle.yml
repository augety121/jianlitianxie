name: Review source bundle
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test && npm run check
      - name: Bundle tracked active source only
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/active-source.zip HEAD README.md LICENSE THIRD_PARTY.md SOURCE-STATE.md .gitignore package.json package-lock.json requirements-test.txt bridge extension src tests scripts docs .github THIRD_PARTY_REUSE.md
          git archive --format=zip --output=dist/extension.zip HEAD extension
      - uses: actions/upload-artifact@v4
        with:
          name: active-source-review
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
